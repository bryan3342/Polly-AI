# Render blueprint — deploys the whole app (API, WebSocket and the built SPA)
# as one Docker service, on a free instance that needs no payment method.
#
# That last part is why this is the target. Cloud Run offers more CPU, but its
# free tier requires a billing account with a card on file, and it bills past
# the free tier rather than stopping. Render's free instance asks for neither.
# deploy/cloudrun/ is kept for when more CPU is worth a card.
#
# Free instance: 512 MB, 0.1 CPU, 750 instance-hours a month.
#
# Memory fits comfortably: the app measures 231 MB after startup and 292 MB
# after inference. CPU is the real constraint -- a tenth of a shared core has to
# run a DeepFace inference per video frame -- so the app is built to degrade
# rather than fall behind: frames that arrive while inference is busy are
# dropped instead of queued, so the emotion readout updates more slowly on a
# slow host rather than drifting further behind for the whole session.
#
# The service sleeps after ~15 minutes without inbound traffic and cold-starts
# on the next request, so the first visit after a quiet period is slow.
services:
  - type: web
    name: polly-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render injects PORT; the container reads it and defaults to 8080.
      - key: PORT
        value: 10000

      # One inference at a time. On a tenth of a core a second concurrent
      # inference adds no throughput -- it splits the same sliver of CPU two
      # ways and makes both slower.
      - key: MAX_CONCURRENT_INFERENCES
        value: 1

      # Close sockets silent for two minutes.
      #
      # Render bills instance-hours rather than requests, and 750 a month
      # against a 744-hour month leaves only about six hours of slack -- so a
      # service kept permanently awake by abandoned browser tabs is a real risk
      # of suspension near month end. The client sends a keepalive whenever its
      # tab is visible, so this reaps abandoned tabs and lets the service sleep,
      # while someone actually using it holds it open.
      - key: WS_IDLE_TIMEOUT_SECONDS
        value: 120

      # Optional. Without it the camera, face detection, emotion tracking and
      # voice measurement all work; transcript and coaching report themselves
      # unavailable. Set it in the Render dashboard, not here.
      - key: GEMINI_API_KEY
        sync: false
