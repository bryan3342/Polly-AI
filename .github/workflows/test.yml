name: Tests

# Gates every push and pull request. Previously the only workflows deployed;
# nothing ran the test suite or the linter, so a green pipeline verified nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # requirements-dev.txt deliberately excludes tensorflow, deepface, librosa
      # and opencv: the unit suite must not need them, which keeps CI fast and
      # avoids installing ~1 GB of wheels to run pure-logic tests.
      - run: pip install -r requirements-dev.txt

      - run: pytest -v

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
