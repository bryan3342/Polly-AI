name: Deploy Frontend to GitHub Pages

# DISABLED (manual-trigger only).
#
# This workflow publishes the frontend on its own to GitHub Pages, where it
# cannot work: the client derives its WebSocket URL from window.location, and
# the Pages host serves no backend, so the app loads and then sits disconnected.
# Asset paths are also wrong there because `base` is not set in vite.config.js.
#
# The supported deployment is the single-service Fly.io build (fly-deploy.yml +
# Dockerfile), where FastAPI serves the built SPA from the same origin.
#
# This file should most likely be deleted outright; it is left here, triggerable
# only by hand, so that removal stays an explicit decision.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
