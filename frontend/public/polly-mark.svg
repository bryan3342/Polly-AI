<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pollyTitle">
  <title id="pollyTitle">Polly AI</title>

  <!--
    Flat vector macaw, facing left, perched on a bare branch.
    Palette, in the order the eye meets it:
      #E07A3E  orange    body, wing, tail and crown
      #C96A33  deep      feather divisions on the wing
      #EFCB92  wheat     breast patch
      #FFFFFF  white     face mask
      #2E3A4E  navy      eye and upper beak
      #6B7280  grey      lower beak, legs and branch

    Drawn back to front: branch, legs, tail, body, breast, wing, head,
    face mask, beak, eye. Each shape sits on top of the one before it, so
    the outline never needs a stroke to separate them.
  -->

  <g fill="none" fill-rule="evenodd">

    <!-- Branch -->
    <path d="M34 176 C70 162 112 154 168 152"
          stroke="#6B7280" stroke-width="7" stroke-linecap="round"/>
    <path d="M104 158 L124 146" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/>

    <!-- Tail: three feathers, longest in the middle -->
    <path d="M112 120 C126 142 136 166 134 190 C122 174 110 148 102 128 Z" fill="#E07A3E"/>
    <path d="M124 116 C142 138 156 164 158 190 C142 174 126 148 116 124 Z" fill="#E07A3E"/>
    <path d="M134 110 C154 128 170 150 176 174 C158 162 140 140 128 120 Z" fill="#E07A3E"/>

    <!-- Legs, gripping the branch -->
    <path d="M86 132 L86 158" stroke="#6B7280" stroke-width="9" stroke-linecap="round"/>
    <path d="M102 132 L102 154" stroke="#6B7280" stroke-width="9" stroke-linecap="round"/>
    <path d="M78 160 L92 155 M96 156 L110 151"
          stroke="#6B7280" stroke-width="6" stroke-linecap="round"/>

    <!-- Body -->
    <path d="M92 46 C124 46 144 74 144 106 C144 132 126 150 100 150
             C72 150 56 128 56 98 C56 68 68 46 92 46 Z" fill="#E07A3E"/>

    <!-- Breast patch, low and to the left -->
    <path d="M74 96 C86 96 93 108 93 122 C93 138 85 148 73 148
             C62 148 56 132 56 116 C56 102 63 96 74 96 Z" fill="#EFCB92"/>

    <!-- Wing -->
    <path d="M108 70 C132 70 146 90 146 114 C146 136 130 150 110 150
             C92 150 82 132 82 110 C82 86 94 70 108 70 Z" fill="#E07A3E"/>
    <path d="M110 80 C130 82 140 98 140 116 M104 90 C122 94 130 108 130 124"
          stroke="#C96A33" stroke-width="3" stroke-linecap="round" opacity=".5"/>

    <!-- Head, with the crown left orange above the mask -->
    <circle cx="90" cy="56" r="32" fill="#E07A3E"/>

    <!-- Face mask: covers the front of the head, crown stays orange -->
    <path d="M80 28 C60 30 50 44 50 62 C50 80 62 90 80 90
             C94 90 102 76 102 60 C102 42 94 28 80 28 Z" fill="#FFFFFF"/>

    <!-- Beak: hooked upper mandible, and the lighter lower one beneath -->
    <path d="M62 32 C40 32 24 46 24 62 C24 78 40 88 60 86
             C48 76 44 48 62 32 Z" fill="#2E3A4E"/>
    <path d="M48 70 C36 74 32 82 36 88 C46 94 60 90 64 80 Z" fill="#6B7280"/>

    <!-- Eye -->
    <circle cx="83" cy="56" r="14" fill="#2E3A4E"/>
    <circle cx="88" cy="50" r="4.8" fill="#FFFFFF"/>
  </g>
</svg>
